<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form for WDD 131">
    <meta name="author" content="Your Name">

    <title>Product Review Form | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Product Review Form</h1>
        <p>Share your experience with our products.</p>
    </header>

    <!-- Main Section -->
    <main>

        <!-- Product Review Form -->
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="productName">Product Name</label>

            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>


            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <label for="rating1">1</label>
                <input type="radio" id="rating1" name="rating" value="1" required>

                <label for="rating2">2</label>
                <input type="radio" id="rating2" name="rating" value="2">

                <label for="rating3">3</label>
                <input type="radio" id="rating3" name="rating" value="3">

                <label for="rating4">4</label>
                <input type="radio" id="rating4" name="rating" value="4">

                <label for="rating5">5</label>
                <input type="radio" id="rating5" name="rating" value="5">

            </fieldset>


            <!-- Date of Installation -->
            <label for="installationDate">Date of Installation</label>

            <input type="date" id="installationDate" name="installationDate" required>


            <!-- Useful Features -->
            <fieldset>

                <legend>Which features did you find useful in the product?</legend>

                <p>Check all that apply.</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>

            </fieldset>


            <!-- Written Review -->
            <label for="writtenReview">Written Review (Optional)</label>

            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>


            <!-- User Name -->
            <label for="userName">Your Name (Optional)</label>

            <input type="text" id="userName" name="userName">


            <!-- Submit Button -->
            <input type="submit" value="Post Review">

        </form>

    </main>


    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 | Product Review Form | WDD 131</p>
        <p>Brigham Young University-Idaho</p>
    </footer>

</body>

</html>
