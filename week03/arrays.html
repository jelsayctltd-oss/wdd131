<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Arrays</title>
</head>
<body>
    <h1>JavaScript Arrays Practice</h1>
    <p>Open the browser console to see the results.</p>

    <script>
        let names = ['Nancy', 'Blessing', 'Jorge', 'Svetlana'];

        console.log(names);
        console.log(names[2]);
        console.log(names.length);

        names.push('Sally');
        console.log(names);

        names.forEach(function(name) {
            console.log(name);
        });

        console.log("After pop:", names.pop());

        console.log("After shift:", names.shift());

        console.log("Final array:", names);
        
    </script>
</body>
</html>
